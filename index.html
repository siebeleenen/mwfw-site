  <!-- Small script: keyboard shortcuts (T -> tickets) and hash -> tab activation -->
  <script>
    // Keyboard shortcut: T goes to tickets page
    document.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 't') location.href = 'tickets.html';
    });

    // Countdown to 14 March 2026 21:00 local time
    (function initCountdown() {
      const dEl = document.getElementById('cc-days');
      const hEl = document.getElementById('cc-hours');
      const mEl = document.getElementById('cc-mins');
      const sEl = document.getElementById('cc-secs');
      const doneEl = document.getElementById('cc-done');
      if (!dEl || !hEl || !mEl || !sEl) return;

      const target = new Date('2026-03-14T21:00:00'); // local time

      function tick() {
        const now = new Date();
        let diff = target - now;
        if (diff <= 0) {
          dEl.textContent = '0';
          hEl.textContent = '0';
          mEl.textContent = '0';
          sEl.textContent = '0';
          if (doneEl) doneEl.classList.remove('hidden');
          clearInterval(timer);
          return;
        }
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        diff -= days * (1000 * 60 * 60 * 24);
        const hours = Math.floor(diff / (1000 * 60 * 60));
        diff -= hours * (1000 * 60 * 60);
        const mins = Math.floor(diff / (1000 * 60));
        diff -= mins * (1000 * 60);
        const secs = Math.floor(diff / 1000);

        dEl.textContent = String(days);
        hEl.textContent = String(hours).padStart(2, '0');
        mEl.textContent = String(mins).padStart(2, '0');
        sEl.textContent = String(secs).padStart(2, '0');
      }

      tick();
      const timer = setInterval(tick, 1000);
    })();
  </script>
