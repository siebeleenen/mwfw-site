name: Deploy Vue to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: List build output
        run: |
          echo "== dist root =="
          ls -la dist
          echo "== dist/img =="
          ls -la dist/img || echo "no dist/img folder"
          echo "== dist/index.html head snippet =="
          sed -n '1,60p' dist/index.html

      - name: Force copy public files into dist (safety)
        run: |
          mkdir -p dist/img
          if [ -d public/img ]; then cp -R public/img dist/; fi
          if [ -f public/robots.txt ]; then cp -f public/robots.txt dist/; fi
          if [ -f public/sitemap.xml ]; then cp -f public/sitemap.xml dist/; fi
          if [ -f public/CNAME ]; then cp -f public/CNAME dist/; fi
          if [ -f public/.nojekyll ]; then cp -f public/.nojekyll dist/; fi
          echo "== dist root after force copy =="
          ls -la dist
          echo "== dist/img after force copy =="
          ls -la dist/img || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
